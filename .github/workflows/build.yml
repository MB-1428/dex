name: Build DEX Release

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build DEX
        run: |
          gradle packageDex --no-daemon

      - name: Prepare package
        run: |
          mkdir -p release
          cp build/release/dex-package.zip release/dex-package.zip

          echo "===== RELEASE FILE ====="
          ls -lah release/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dex-package
          path: release/dex-package.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/dex-package.zip