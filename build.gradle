plugins {
    id 'java'
}

group = 'com.example.dex'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

configurations {
    d8
}

dependencies {
    d8 'com.android.tools:r8:8.13.17'
}

// ✅ 新增：打包 class 文件为 JAR 的任务
tasks.register('jarClasses', Jar) {
    dependsOn tasks.named('classes')
    archiveFileName = 'classes.jar'
    destinationDirectory = file("$buildDir/libs")
    from("$buildDir/classes/java/main")
}

// ✅ 修改：buildDex 现在依赖 jarClasses，并使用 JAR 文件作为输入
tasks.register('buildDex', JavaExec) {

    dependsOn tasks.named('jarClasses')  // ← 改：原来是 dependsOn 'classes'

    classpath = configurations.d8

    mainClass = 'com.android.tools.r8.D8'

    args '--min-api', '23'
    args '--output', file("$buildDir/dex").absolutePath
    args file("$buildDir/libs/classes.jar").absolutePath  // ← 改：原来是 "$buildDir/classes/java/main"

    doFirst {
        file("$buildDir/dex").mkdirs()
    }
}

tasks.register('packageDex', Zip) {

    dependsOn tasks.named('buildDex')

    archiveFileName = 'dex-package.zip'

    destinationDirectory = file("$buildDir/release")

    from("$buildDir/dex") {
        include 'classes.dex'
    }
}
